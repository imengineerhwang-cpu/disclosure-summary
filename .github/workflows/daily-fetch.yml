name: Daily disclosure fetch

on:
  schedule:
    # 매일 20:00 KST = 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch DART disclosures + prices + times
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m disclosure_summary.fetch

      - name: Render HTML report
        run: python -m disclosure_summary.render

      - name: Update root redirect to latest report
        run: |
          DATE=$(date +%Y-%m-%d)
          cat > index.html <<HTML
          <!doctype html>
          <html lang="ko"><head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=reports/${DATE}/">
          <title>매매를 위한 오늘의 공시 정리</title>
          </head><body>
          <p>최신 리포트(${DATE})로 이동합니다... <a href="reports/${DATE}/">바로가기</a></p>
          </body></html>
          HTML

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ index.html
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 휴장일이거나 이미 동일한 리포트일 가능성"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "report: ${DATE} 일일 공시 리포트 자동 생성"
            git push
          fi
